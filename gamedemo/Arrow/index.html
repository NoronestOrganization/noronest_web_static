<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | ArcheryGame</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #unity-container {
        width: 960px;
        height: 600px;
        margin: 0 auto;
        position: relative;
      }
      #unity-canvas {
        width: 960px;
        height: 600px;
        display: block;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
      }
      #unity-logo {
        width: 154px;
        height: 130px;
        background: url('TemplateData/unity-logo-dark.png') no-repeat center;
      }
      #unity-progress-bar-empty {
        width: 141px;
        height: 18px;
        margin-top: 10px;
        background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 18px;
        background: url('TemplateData/progress-bar-full-dark.png') no-repeat center;
      }
      #unity-footer {
        width: 960px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 0;
      }
      #unity-fullscreen-button {
        cursor: pointer;
        width: 38px;
        height: 38px;
        background: url('TemplateData/fullscreen-button.png') no-repeat center;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 5%;
        transform: translate(-50%);
        background: white;
        padding: 10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">ArcheryGame</div>
    </div>

    <script src="Build/NoronestBuilds.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Fix canvas to exact pixel dimensions — prevents the 33M px WebGL crash
      canvas.width  = 960;
      canvas.height = 600;
      canvas.style.width  = "960px";
      canvas.style.height = "600px";

      var buildUrl = "Build";
      var config = {
        dataUrl:            buildUrl + "/NoronestBuilds.data.unityweb",
        frameworkUrl:       buildUrl + "/NoronestBuilds.framework.js.unityweb",
        codeUrl:            buildUrl + "/NoronestBuilds.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "DefaultCompany",
        productName:        "ArcheryGame",
        productVersion:     "1.0",
        matchWebGLToCanvasSize: false,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
